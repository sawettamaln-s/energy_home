name: energy_home
description: "Home Energy Behavior Monitoring and Analysis System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ----- แจ้งเตือน -----
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4          # ใช้คำนวณเวลาสำหรับ scheduled notification
  permission_handler: ^11.3.1  # ขอสิทธิ์แจ้งเตือนบน Android 13+

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3

  google_sign_in: ^7.2.0  # เข้าสู่ระบบ/สมัครสมาชิกด้วย Gmail


  # UI
  fl_chart: ^0.69.0
  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # ----- สำหรับเทส widget ที่พึ่ง Firebase (AuthGate ฯลฯ) -----
  # เวอร์ชันต้องคู่กับ firebase_auth ^5.x / cloud_firestore ^5.x ด้านบน
  # (ดู compatibility table ที่ pub.dev ของแต่ละแพ็กเกจ)
  firebase_auth_mocks: ^0.14.2
  fake_cloud_firestore: ^3.1.0
  # ใช้คู่กับ firebase_auth_mocks สำหรับ whenCalling(...).on(...).thenThrow(...)
  # (จำลอง FirebaseAuthException ตอนเทส เช่น wrong-password, user-not-found)
  # ประกาศตรงๆ เพราะเทส import โดยตรง (ไม่พึ่ง transitive dependency)
  mock_exceptions: ^0.8.2
  # สร้างไอคอนแอปจาก assets/icon/ (รัน: dart run flutter_launcher_icons)
  flutter_launcher_icons: ^0.14.4

# ไอคอนแอป: โลโก้ Energy Home บ้านสีขาวบนพื้นเขียว (AppColors.primaryGreen)
# Android 8+ ใช้ adaptive icon (พื้นเขียว + ตัวบ้านโปร่งใส เผื่อขอบให้ launcher ตัดเป็นวงกลม)
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#2B4E24"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#2B4E24"
    theme_color: "#2B4E24"

flutter:
  uses-material-design: true

  # โลโก้ Energy Home: logo_mark (บ้านเขียว ใช้บนพื้นสว่าง), logo_mark_white (บ้านขาว ใช้บนพื้นเขียว)
  assets:
    - assets/images/

  # ฟอนต์หลักของแอป (ฝังในแอป ใช้ได้แม้ออฟไลน์) — สัญญาอนุญาต SIL OFL 1.1
  # ดู assets/fonts/OFL.txt
  fonts:
    - family: IBMPlexSansThai
      fonts:
        - asset: assets/fonts/IBMPlexSansThai-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansThai-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansThai-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansThai-Bold.ttf
          weight: 700