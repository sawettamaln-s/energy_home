name: Flutter CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # lib/firebase_options.dart ถูก .gitignore กันไว้เพราะมีค่า config เฉพาะ
      # Firebase project จริง ใน CI ใช้ไฟล์ placeholder แทนแค่พอให้ compile ได้
      # (เทสในโปรเจกต์นี้ไม่เรียก Firebase.initializeApp() จริง ใช้
      # fake_cloud_firestore / firebase_auth_mocks แทนทั้งหมด จึงไม่กระทบผลเทส)
      - name: Provide placeholder Firebase config
        run: cp lib/firebase_options.sample.dart lib/firebase_options.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test